name: zh-sync-release

# 每天 UTC 12:30（北京 20:30）自动：同步上游 → 合并汉化 → 打包 → 发布带版本号的 Release。
# 手动触发：Actions → zh-sync-release → Run workflow（可勾选“强制重新打包”）。
# 汉化文件或本工作流有改动时也会自动触发。

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "强制重新打包（忽略无变化跳过）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "res/values-zh/**"
      - ".github/workflows/zh-sync-release.yml"

permissions:
  contents: write

concurrency:
  group: zh-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git config user.name "zh-bot"
          git config user.email "zh-bot@users.noreply.github.com"
          git remote add upstream https://github.com/fmhyplay/android.git
          git fetch --tags upstream main
          git merge --no-edit upstream/main
          git push origin main

      - name: Nothing new since the last release?
        id: check
        run: |
          LAST_TAG=$(git tag -l 'zh-v*-r*' --sort=-creatordate | head -1)
          if [ -n "$LAST_TAG" ] && [ "${{ inputs.force_build }}" != "true" ] \
             && [ "$(git rev-parse "$LAST_TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing new since $LAST_TAG; skipping the build."
          else
            echo "Building. Last release: ${LAST_TAG:-none}."
          fi

      - name: Version from the newest upstream tag
        if: steps.check.outputs.skip != 'true'
        run: |
          V=$(git describe --tags --abbrev=0 upstream/main)
          V=${V#v}
          IFS=. read -r MA MI PA <<< "$V"
          PA="${PA%%[^0-9]*}"; PA="${PA:-0}"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          # 上游的 versionCode + 流水线序号（个位），保证每次发布都递增且不越过下一个版本
          echo "VERSION_CODE=$((MA * 10000 + MI * 100 + PA + GITHUB_RUN_NUMBER % 100))" >> "$GITHUB_ENV"

      - name: Point the in-app updater at this fork
        if: steps.check.outputs.skip != 'true'
        run: |
          sed -i 's|repos/fmhyplay/android|repos/hzxs163/fmhyplay-android|' src/me/champdev/weblock/Update.java
          grep -q 'hzxs163/fmhyplay-android' src/me/champdev/weblock/Update.java \
            || echo "::warning::Update.java did not contain the upstream repo path; the in-app updater may check the wrong repo"

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        if: steps.check.outputs.skip != 'true'
        with:
          go-version-file: warp/go.mod
          cache-dependency-path: warp/go.sum

      - name: Android SDK
        if: steps.check.outputs.skip != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;35.0.0" > /dev/null

      - name: Build the WARP helper
        if: steps.check.outputs.skip != 'true'
        run: warp/build.sh

      - name: Signing key
        if: steps.check.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] || { echo "::error::KEYSTORE_B64 / KEYSTORE_PASS secrets are not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          printf %s "$KEYSTORE_PASS" > release.pass

      - name: Release notes
        if: steps.check.outputs.skip != 'true'
        run: |
          awk -v v="$VERSION_NAME" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > upstream-notes.md
          [ -s upstream-notes.md ] || echo "FMHYPlay $VERSION_NAME" > upstream-notes.md
          {
            echo "简体中文汉化版，基于上游 [FMHYPlay $VERSION_NAME](https://github.com/fmhyplay/android/releases/tag/v$VERSION_NAME)。"
            echo
            echo "- 构建时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            echo "- 上游提交：$(git rev-parse --short upstream/main)（$(git log -1 --format=%cs upstream/main)）"
            echo "- 应用内更新检查已指向本仓库，升级会自动装中文版"
            echo
            echo "### 上游 $VERSION_NAME 更新日志"
            cat upstream-notes.md
          } > notes.md

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: ./build.sh

      # 带版本号的文件名 + 固定文件名的最新版直链（releases/latest/download/FMHYPlay-TV.apk）
      - name: Latest copies and checksums
        if: steps.check.outputs.skip != 'true'
        run: |
          mv "FMHYPlay-TV-v$VERSION_NAME.apk" "FMHYPlay-TV-v$VERSION_NAME-zh.apk"
          mv "FMHYPlay-Android-v$VERSION_NAME.apk" "FMHYPlay-Android-v$VERSION_NAME-zh.apk"
          cp "FMHYPlay-TV-v$VERSION_NAME-zh.apk" FMHYPlay-TV.apk
          cp "FMHYPlay-Android-v$VERSION_NAME-zh.apk" FMHYPlay-Android.apk
          sha256sum FMHYPlay-*.apk | tee SHA256SUMS.txt
          for f in FMHYPlay-*.apk; do
            "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$f" | grep -E "Signer #1 certificate SHA-256"
          done

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="zh-v$VERSION_NAME-r$GITHUB_RUN_NUMBER"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            "FMHYPlay-TV-v$VERSION_NAME-zh.apk" \
            "FMHYPlay-Android-v$VERSION_NAME-zh.apk" \
            FMHYPlay-TV.apk FMHYPlay-Android.apk SHA256SUMS.txt \
            --title "FMHYPlay $VERSION_NAME 中文版" --notes-file notes.md
          echo "Published $TAG"
